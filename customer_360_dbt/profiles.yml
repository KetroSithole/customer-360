# Databricks connection. Set these environment variables before running dbt:
#   DATABRICKS_HOST        e.g. adb-1234567890.12.azuredatabricks.net
#   DATABRICKS_HTTP_PATH   e.g. /sql/1.0/warehouses/abc123
#   DATABRICKS_TOKEN       a personal access token
customer_360:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: casestudy
      schema: analytics
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
